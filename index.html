<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>маленькое созвездие</title>
<style>
:root{
  color-scheme: dark;
  --bg:#010205; --text:#f5f3ff; --muted:#aaa8c7;
  --line:rgba(205,201,255,.22); --glow:rgba(177,164,255,.7);
  --card:rgba(18,19,45,.82);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);overflow:hidden}
#app{position:relative;min-height:100vh;width:100%;background:
 radial-gradient(circle at 50% 48%,rgba(56,45,105,.10),transparent 34%),
 radial-gradient(circle at 20% 20%,rgba(45,66,120,.045),transparent 28%),
 var(--bg);overflow:hidden}
#stars{position:absolute;inset:0}
.star-bg{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.45;animation:twinkle var(--d) ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.08;transform:scale(.5)}}
.shooting{position:absolute;width:110px;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:0;transform:rotate(-28deg);filter:drop-shadow(0 0 5px #fff);animation:shoot 7s linear infinite}
@keyframes shoot{0%,72%{opacity:0;transform:translate(0,0) rotate(-28deg)}75%{opacity:.8}84%{opacity:0;transform:translate(-220px,125px) rotate(-28deg)}100%{opacity:0}}
.content{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.for-you{font-family:Georgia,serif;font-size:18px;letter-spacing:.12em;color:rgba(245,243,255,.82);margin-bottom:8px;text-shadow:0 0 18px rgba(177,164,255,.35)}
.constellation{position:relative;width:min(650px,90vw);height:min(390px,53vh);min-height:300px}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.constellation-line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 7;fill:none;transition:stroke .4s,opacity .4s}
.node{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border:0;border-radius:50%;background:transparent;cursor:pointer;padding:0}
.node::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 0 7px 2px #fff,0 0 20px 7px var(--glow);transition:.25s}
.node::after{content:"";position:absolute;inset:4px;border-radius:50%;background:rgba(255,255,255,.04);transition:.25s}
.node:hover::before,.node.active::before{width:10px;height:10px;box-shadow:0 0 9px 3px #fff,0 0 28px 10px var(--glow)}
.node:hover::after,.node.active::after{background:rgba(190,179,255,.13)}
.hint{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:12px;color:#8583a6;white-space:nowrap}
.message{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);width:min(390px,calc(100vw - 42px));padding:16px 20px;text-align:center;border:1px solid rgba(196,188,255,.18);border-radius:18px;background:rgba(7,8,16,.9);backdrop-filter:blur(14px);box-shadow:0 15px 60px rgba(0,0,0,.65),0 0 35px rgba(129,109,220,.12);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:5}
.message::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px #fff,0 0 22px 7px var(--glow);bottom:-4px;left:50%;transform:translateX(-50%)}
.message.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.message p{font-family:Georgia,serif;font-size:17px;line-height:1.45;margin:0}
.close{position:absolute;right:10px;top:8px;border:0;background:none;color:#777593;cursor:pointer;font-size:18px}
@media(max-width:520px){.content{padding:22px}.intro{margin-bottom:5px}.constellation{height:360px;min-height:280px}.hint{bottom:7px}}
</style>
</head>
<body>
<div id="app">
  <div id="stars"></div>
  <div class="shooting" style="left:78%;top:18%;animation-delay:1s"></div>
  <div class="shooting" style="left:38%;top:8%;animation-delay:4.2s"></div>
  <main class="content">
    <div class="for-you">For u</div>
    <div class="constellation" id="constellation">
      <svg viewBox="0 0 650 390" preserveAspectRatio="none" aria-hidden="true">
        <path class="constellation-line" d="M95 155 L165 82 L275 122 L325 92 L375 122 L485 82 L555 155 L470 270 L325 340 L180 270 L95 155"/>
        <path class="constellation-line" d="M165 82 L180 270"/>
        <path class="constellation-line" d="M275 122 L325 340"/>
        <path class="constellation-line" d="M375 122 L325 340"/>
        <path class="constellation-line" d="M485 82 L470 270"/>
      </svg>
    </div>
    <div class="hint">нажми на любую звезду</div>
  </main>
  <div class="message" id="message">
    <button class="close" id="close">×</button>
    <p id="messageText"></p>
  </div>
</div>
<script>
const compliments = [
 "Кстати, мне нравятся твои голубые глаза.",
 "Твои волосы просто шикарны.",
 "Твой голос заставляет улыбаться.",
 "С тобой классно общаться.",
 "Ты очень милая и красивая.",
 "Твои сообщения помогают в тяжёлые дни.",
 "С тобой интересно и легко общаться.",
 "У тебя есть какая-то своя особенная атмосфера, которую сложно не заметить.",
 "Мне нравится, как ты умеешь делать обычный разговор немного теплее."
];
const positions = [
  [14.6,39.7],[25.4,21],[42.3,31.3],[50,23.6],[57.7,31.3],
  [74.6,21],[85.4,39.7],[72.3,69.2],[50,87.2]
];
const box=document.getElementById('constellation');
const message=document.getElementById('message');
const text=document.getElementById('messageText');
const close=document.getElementById('close');

for(let i=0;i<9;i++){
  const b=document.createElement('button');
  b.className='node';
  b.style.left=positions[i][0]+'%';
  b.style.top=positions[i][1]+'%';
  b.setAttribute('aria-label','Звезда '+(i+1));
  b.addEventListener('click',()=>{
    document.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    text.textContent=compliments[i];
    const rect=b.getBoundingClientRect();
    message.style.left=(rect.left+rect.width/2)+'px';
    message.style.top=(rect.top+rect.height/2-92)+'px';
    message.classList.add('show');
  });
  box.appendChild(b);
}
close.addEventListener('click',()=>{
  message.classList.remove('show');
  document.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));
});

const bg=document.getElementById('stars');
for(let i=0;i<95;i++){
  const s=document.createElement('i');
  s.className='star-bg';
  s.style.left=(Math.random()*100)+'%';
  s.style.top=(Math.random()*100)+'%';
  s.style.setProperty('--d',(2+Math.random()*5)+'s');
  s.style.animationDelay=(-Math.random()*5)+'s';
  s.style.transform='scale('+(0.5+Math.random()*1.4)+')';
  bg.appendChild(s);
}
</script>
</body>
</html>
